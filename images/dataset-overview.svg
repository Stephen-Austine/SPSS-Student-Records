<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">SPSS Student Records dataset overview</title>
  <desc id="description">Five student records, five variables, and three measurement levels: nominal, ordinal, and scale.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#183d5b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53d6c5"/>
      <stop offset="1" stop-color="#84e2a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="390" rx="26" fill="url(#background)"/>
  <circle cx="1080" cy="38" r="155" fill="#ffffff" opacity=".035"/>
  <circle cx="28" cy="370" r="150" fill="#53d6c5" opacity=".06"/>
  <rect x="64" y="58" width="10" height="62" rx="5" fill="url(#accent)"/>
  <text x="98" y="82" fill="#8ee7d9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">A COMPACT SPSS PRACTICE DATASET</text>
  <text x="98" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Student Records</text>
  <text x="98" y="164" fill="#c6d6e3" font-family="Arial, Helvetica, sans-serif" font-size="18">Explore variable definition, measurement levels, and value labels.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="214" width="226" height="112" rx="16" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="88" y="256" fill="#ffffff" font-size="34" font-weight="700">05</text>
    <text x="88" y="292" fill="#c6d6e3" font-size="16">student records</text>
    <rect x="310" y="214" width="226" height="112" rx="16" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="334" y="256" fill="#ffffff" font-size="34" font-weight="700">05</text>
    <text x="334" y="292" fill="#c6d6e3" font-size="16">documented variables</text>
    <rect x="556" y="214" width="226" height="112" rx="16" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="580" y="256" fill="#ffffff" font-size="34" font-weight="700">00</text>
    <text x="580" y="292" fill="#c6d6e3" font-size="16">missing values</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="840" y="224" fill="#c6d6e3" font-size="14" font-weight="700" letter-spacing="1.5">MEASUREMENT LEVELS</text>
    <rect x="840" y="244" width="292" height="38" rx="19" fill="#53d6c5" opacity=".16"/>
    <circle cx="862" cy="263" r="6" fill="#53d6c5"/>
    <text x="880" y="269" fill="#d9fff8" font-size="16" font-weight="700">Nominal</text>
    <text x="1020" y="269" fill="#c6d6e3" font-size="14">categories</text>
    <rect x="840" y="291" width="292" height="38" rx="19" fill="#84e2a8" opacity=".16"/>
    <circle cx="862" cy="310" r="6" fill="#84e2a8"/>
    <text x="880" y="316" fill="#e1ffea" font-size="16" font-weight="700">Ordinal</text>
    <text x="1020" y="316" fill="#c6d6e3" font-size="14">ordered</text>
    <rect x="840" y="338" width="292" height="38" rx="19" fill="#f3c76a" opacity=".16"/>
    <circle cx="862" cy="357" r="6" fill="#f3c76a"/>
    <text x="880" y="363" fill="#fff1cd" font-size="16" font-weight="700">Scale</text>
    <text x="1020" y="363" fill="#c6d6e3" font-size="14">numeric</text>
  </g>
</svg>
